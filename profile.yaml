tagline: "Energy materials, electrochemistry, and molecular simulation"
description: "Ankit Mathanker is a postdoctoral scholar at the University of Chicago / Argonne National Laboratory studying organic battery materials, electrochemical interfaces, and molecular simulation."
profile_image: "img/photo-real.png"

about_paragraphs:
  - "I am a postdoctoral scholar at the University of Chicago / Argonne National Laboratory. My current research focuses on covalent organic frameworks as organic cathode materials for lithium-ion batteries, with the aim of improving capacity and stability."
  - "I completed my Ph.D. in Chemical Engineering and Scientific Computing at the University of Michigan in August 2026. My doctoral work examined how electrode potential and electrolyte composition affect molecular adsorption and electrocatalytic reactions. I use density functional theory, molecular dynamics, and machine learning interatomic potentials to study these systems, and I also develop automated workflows for quantum chemistry."
  - "Before Michigan, I studied the conversion of lignocellulosic biomass into biofuels at the University of Alberta. Across these projects, I am interested in connecting molecular-scale understanding with the design of materials and processes for energy applications."

research_areas:
  - title: "Organic cathodes for lithium-ion batteries"
    context: "Current work · University of Chicago"
    description: "Developing cathode materials based on covalent organic frameworks, with a focus on stable, high-capacity organic electrodes for lithium-ion batteries."
  - title: "Electrochemical interfaces and catalysis"
    context: "Doctoral research · University of Michigan"
    description: "Studying how aqueous ions, electrode potential, and co-reactants influence adsorption and the hydrogenation of organic molecules. This work combines electronic-structure calculations, molecular dynamics, and comparisons with experiment."
    link: "https://doi.org/10.1021/acs.jpcc.5c02870"
    link_label: "Ion effects on adsorption"
  - title: "Machine learning interatomic potentials"
    context: "University of Michigan · Lawrence Livermore National Laboratory"
    description: "Developing and benchmarking interatomic potentials for metal–electrolyte interfaces. These models make it possible to sample interfacial water and ions over longer times while retaining a connection to first-principles calculations."
    link: "https://doi.org/10.1021/acselectrochem.5c00540"
    link_label: "Potential-dependent interfacial properties"
  - title: "Automated quantum chemistry"
    context: "Ongoing collaboration"
    description: "Developing TSAgent, an agentic workflow for transition-state searches at the density functional theory level. The workflow plans calculations, evaluates their results, and revises the search as it proceeds."
    link: "https://arxiv.org/abs/2605.14154"
    link_label: "Read the TSAgent preprint"

